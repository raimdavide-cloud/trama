  <text class="ax-bm" x="56" y="458">127.0.0.1:8790 · CORS + PNA</text>
  <text class="ax-bs" x="56" y="482">Origin in elenco · token opzionale</text>
  <text class="ax-bs" x="56" y="502">max 2 richieste · timeout 10 min</text>
  <rect class="ax-b" x="36" y="570" width="332" height="114" rx="12"/>
  <text class="ax-bt" x="56" y="600">Claude Code (CLI)</text>
  <text class="ax-bs" x="56" y="624">Abbonamento dell'utente</text>
  <text class="ax-bm" x="56" y="648">claude -p --tools ""</text>
  <text class="ax-bs" x="56" y="670">cartella temporanea vuota</text>

  <rect class="ax-b" x="434" y="66" width="332" height="110" rx="12"/>
