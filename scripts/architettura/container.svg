  <text class="ax-bs" x="454" y="262">api/router.mjs · senza stato · 60 s max</text>
  <rect class="ax-row" x="454" y="278" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="468" y="304">/auth · OAuth 3LO, sessioni</text>
  <rect class="ax-row" x="454" y="328" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="468" y="354">/projects · documenti, delta, batch</text>
  <rect class="ax-row" x="454" y="378" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="468" y="404">/jira/:op · 11 operazioni ammesse</text>
  <text class="ax-bs" x="454" y="446">Ogni richiesta: sessione → stessa origine →</text>
  <text class="ax-bs" x="454" y="466">sito Atlassian dell'utente → validazione</text>
  <text class="ax-bm" x="454" y="496">token Atlassian cifrati AES-256-GCM</text>
  <text class="ax-bm" x="454" y="516">segreti solo nelle variabili d'ambiente</text>

  <rect class="ax-b" x="434" y="570" width="332" height="114" rx="12"/>
  <text class="ax-bt" x="454" y="600">Cron · 03:00 UTC</text>
  <text class="ax-bs" x="454" y="624">Personal Data Reporting;</text>
  <text class="ax-bs" x="454" y="644">cancellazione degli account chiusi</text>
  <text class="ax-bm" x="454" y="668">Authorization: Bearer CRON_SECRET</text>

  <rect class="ax-b" x="832" y="66" width="332" height="262" rx="12"/>
  <text class="ax-bt" x="852" y="96">Neon Postgres · eu-central-1</text>
  <text class="ax-bs" x="852" y="118">driver serverless su HTTPS · pooler</text>
  <text class="ax-bm" x="852" y="150">users</text><text class="ax-bs" x="944" y="150">token cifrati, siti</text>
  <text class="ax-bm" x="852" y="178">sessions</text><text class="ax-bs" x="944" y="178">SHA-256 dell'id</text>
  <text class="ax-bm" x="852" y="206">projects</text><text class="ax-bs" x="944" y="206">cloud_id = confine</text>
  <text class="ax-bm" x="852" y="234">items</text><text class="ax-bs" x="944" y="234">JSONB, delta per updated_at</text>
  <text class="ax-bs" x="852" y="270">PK (project_id, col, id)</text>
  <text class="ax-bs" x="852" y="292">indice (project_id, updated_at)</text>

