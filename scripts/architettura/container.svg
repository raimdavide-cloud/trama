  <rect class="ax-row" x="56" y="134" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="70" y="160">Estrazione Word/PDF/Excel nel browser</text>
  <rect class="ax-row" x="56" y="184" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="70" y="210">Regole, validazione, piano di creazione</text>
  <rect class="ax-row" x="56" y="234" width="292" height="42" rx="8"/>
  <text class="ax-rt" x="70" y="260">Delta ogni 6 s · 30 s da fermo</text>
  <rect class="ax-row" x="56" y="284" width="292" height="42" rx="8"/>
