  <text class="ax-bs" x="454" y="120">home, guida, marchio, componenti,</text>
  <text class="ax-bs" x="454" y="140">privacy, architettura, app</text>
  <text class="ax-bm" x="454" y="162">CDN Vercel · cleanUrls</text>

  <rect class="ax-b ax-k" x="434" y="210" width="332" height="320" rx="12"/>
