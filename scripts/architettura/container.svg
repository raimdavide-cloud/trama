  <text class="ax-bs" x="866" y="525">Project › Fase › Epica › ticket</text>
  <text class="ax-bm" x="866" y="548">api.atlassian.com/ex/jira/{cloudId}</text>
  <rect class="ax-row" x="852" y="574" width="292" height="62" rx="8"/>
  <text class="ax-rt" x="866" y="598">Personal Data Reporting API</text>
