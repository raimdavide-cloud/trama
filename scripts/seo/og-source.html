<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;600&family=JetBrains+Mono:wght@600&display=swap">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:linear-gradient(135deg,#141B47 0%,#23307A 100%);color:#fff;font-family:"Figtree",system-ui,sans-serif;position:relative}
  .logo{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:16px;font:800 44px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
  .logo svg{width:52px;height:52px}
  .logo .wm{display:inline-flex;align-items:baseline}
  .logo .wm .t{width:auto;height:.64em;fill:#5AAEF5;margin-right:.045em}
  .copy{position:absolute;left:72px;top:150px;width:640px}
  .eyebrow{font:600 20px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#F2A541;margin-bottom:26px}
  h1{font:800 70px/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
  h1 span{color:#AEB5DD}
  p{margin-top:28px;font:500 28px/1.35 "Figtree",sans-serif;color:#D6DAF2;max-width:600px}
  .url{position:absolute;left:72px;bottom:44px;font:600 20px/1 "JetBrains Mono",monospace;color:#AEB5DD;letter-spacing:.04em}
  #weave{position:absolute;right:56px;top:115px;width:400px;height:400px}
</style></head>
<body>
<div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#3448C5"/><rect x="6" y="7.5" width="20" height="4.5" rx="2.25" fill="#fff"/><rect x="6" y="20" width="20" height="4.5" rx="2.25" fill="#fff"/><rect x="13.75" y="4.5" width="4.5" height="23" rx="2.25" fill="#F2A541"/><rect x="6" y="13.75" width="20" height="4.5" rx="2.25" fill="#fff" stroke="#3448C5" stroke-width="1.6"/></svg><span class="wm"><svg class="t" viewBox="0 0.5 21 47" aria-hidden="true"><path d="M11.9965 22.2955L20.9933 20.5916V11.3622L11.9965 12.9239V0.5L0 2.55932V33.2999C0 44.2332 5.78374 47.57 13.2098 47.4989C15.6386 47.4989 18.1378 47.0735 20.7084 46.4348L18.9947 37.2043C17.7802 37.6308 16.5659 37.773 15.6386 37.773C13.3528 37.7019 11.9965 36.3523 11.9965 33.371V22.2955Z"/></svg>rama</span></div>
<div class="copy"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="sub"></p></div>
<svg id="weave" viewBox="0 0 400 400"></svg>
<div class="url">trama-backlog.vercel.app</div>
<script>
const V={
  home:{e:"Dal requisito a Jira",t:'Dal documento al backlog, <span>con le regole.</span>',s:"Un percorso guidato in 6 passi, con Claude e il playbook del gruppo."},
  brand:{e:"Linee guida del marchio",t:'Il marchio <span>Trama.</span>',s:"Nome, logo, colori, tipografia e tono di voce."},
  install:{e:"Guida per i colleghi",t:'Collega Claude <span>a Trama.</span>',s:"Ponte Claude Code sul tuo computer, in circa 15 minuti."},
  privacy:{e:"Informativa privacy",t:'Come Trama <span>tratta i tuoi dati.</span>',s:"Quali dati, dove sono conservati e come cancellarli."}
}[new URLSearchParams(location.search).get("v")||"home"];
document.getElementById("eyebrow").textContent=V.e;document.getElementById("title").innerHTML=V.t;document.getElementById("sub").textContent=V.s;
// Tessitura semplice: 5 fili di trama (bianchi, orizzontali) su 5 di ordito (indaco chiaro, verticali; uno zafferano). Sopra/sotto alternati.
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("weave"),N=5,T=44,G=70,O=(400-((N-1)*G+T))/2;
const el=(n,a)=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);svg.appendChild(x);return x};
const pos=i=>O+i*G, warpFill=j=>j===2?"#F2A541":"#5C6FE0";
for(let j=0;j<N;j++)el("rect",{x:pos(j),y:10,width:T,height:380,rx:T/2,fill:warpFill(j)});
for(let i=0;i<N;i++)el("rect",{x:10,y:pos(i),width:380,height:T,rx:T/2,fill:"#fff"});
for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2===0){ // l'ordito passa sopra: ridisegna il tratto di ordito sul filo
  el("rect",{x:pos(j),y:pos(i)-3,width:T,height:T+6,fill:warpFill(j),stroke:"#23307A","stroke-width":3});
  el("rect",{x:pos(j)+1.5,y:pos(i)-1.5,width:T-3,height:T+3,fill:warpFill(j)});
}
</script></body></html>
