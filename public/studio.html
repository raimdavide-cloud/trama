/* ================= vocabolario del playbook ================= */
const AREAS={
  be:{label:"Back-end / Cloud",prefix:"[BE]",comp:["be"],team:"be",work:"Back-End"},
  web:{label:"FE Web",prefix:"[FE - Web]",comp:["web"],team:"web",work:"UI"},
  mobile:{label:"FE Mobile",prefix:"[FE - Mobile]",comp:["mobile"],team:"mobile",work:"UI"},
  fw:{label:"Firmware / librerie",prefix:"[FW]",comp:["fw"],team:"fw",work:"Logic"},

  "ux-both":{label:"UX Web/Mobile",prefix:"[UX - Web/Mobile]",comp:["web","mobile"],team:"ux",work:"UX-UI"}};
const COMP_LABEL={be:"Back-end / Cloud",web:"Web App",mobile:"Mobile App",fw:"Firmware"};

const CANON=Object.fromEntries(LABELS.map(l=>[l.toLowerCase().replace(/[^a-z0-9]/g,""),l]));
const canonLabel=l=>CANON[String(l).toLowerCase().replace(/[^a-z0-9]/g,"")]||/^release\s*\d+$/i.test(l)&&("Release"+String(l).match(/\d+/)[0])||l;
const SECTIONS={
  Story:["## Context","## User story","## Scope / Action","## Dependencies","## Points to clarify","## Acceptance criteria","## References"],
  Bug:["## Context","## Steps to reproduce","## Expected result","## Actual result","## Evidence","## Acceptance criteria"],

const TEMPLATES={
Story:`## Context
Why this is needed: the requirement, the decision or the gap that triggers it.

## User story
As a <role>, I want <capability>, so that <benefit>.

## Scope / Action
* What to build or change, one bullet per piece of work.
* API, data and compatibility constraints (what must not break).

## Acceptance criteria

## Steps to reproduce

## Content to include

## Reference
Existing apps or frames to use as reference (content and tone, not layout).

## Points to define in the design
Entry points, states, errors, offline behaviour, responsive, white label.

## Acceptance criteria
* Design frames ready for each platform, reviewed with the PO, shared with the dev teams.`,
Task:`## Context

## Action

## Acceptance criteria

## Notes
Code locations, related tickets.`};
const STD_QUESTIONS={
"Prodotto e perimetro":["Quali piattaforme: Web, iOS, Android, cloud, firmware, dispositivi?","Esistono versioni white label o per altri marchi, e con quali differenze?","Cosa entra nella prima release e cosa nelle successive? Con quali date?","Quali requisiti dipendono da hardware, firmware o librerie non ancora disponibili?"],
"Persone e decisioni":["Chi decide lato cliente su priorità, UX e release?","Chi è il riferimento tecnico lato cliente?","Chi compone il team interno, con quali ruoli e quali componenti?"],
"Processo":["Durata degli sprint e giorno di planning.","Ambienti disponibili e a cosa serve ciascuno.","Chi fa QA manuale e automatico, su quale ambiente.","Cadenza di rilascio e chi dà il via libera."],
"Comunicazione":["Lingua dei ticket e della documentazione.","Lingua e tono verso il cliente.","Frequenza e formato degli status update."],
"Strumenti":["Progetto nel tracker esistente o da creare? Campi custom obbligatori?","Dove vivono i design e la documentazione?"]};

function defaultKit(){return{productName:"",components:{be:"",web:"",mobile:"",fw:""},releases:[],epics:[],
  team:{be:{},web:{},mobile:{},fw:{},ux:{},qa:{}},types:{Story:"Story","UX Story":"UX Story",Task:"Task",Bug:"Bug",Epic:"Epic"},
  links:{relates:"",blocks:""},custom:{},extraLabels:"",glossary:"",constraints:"",envs:"",
  lang:{po:"Italiano",tickets:"English",client:"English, registro formale"},autoAssign:true,
  hier:{enabled:true,projectType:"",phaseType:"",examples:{project:"",phase:"",epic:""},project:{key:"",name:""},phases:[]}}}

const RULES=`Sei l'assistente AI di un Product Owner e applichi il playbook "dal documento di requisiti al progetto in esecuzione".
REGOLE:
- Il PO decide; tu proponi, scrivi, segnali ipotesi e punti aperti. Dichiara sempre ogni ipotesi.
- Fase 0: un requisito per riga con ID stabile, titolo, descrizione dal punto di vista dell'utente, componenti (Web App, Mobile App, Back-end/Cloud, Firmware), release, note UI/UX (sulla riga giusta: attenzione alle colonne sfalsate), dipendenze esterne e interne, domande aperte. Le domande di apertura si chiudono prima di creare ticket; dove manca la risposta si scrive un'ipotesi esplicita.
- Kit: identificativi del tracker; per ogni release un nome e una label Release1, Release2… (ogni release è una Fase in Jira); epiche per area funzionale più "Cross-cutting polish" per infrastruttura, CI e rifiniture; label canoniche (Back-End, UI, Logic, UX-UI, Automation_Test, Manual_Test, Android, iOS, NeedsDesignClarification) sempre scritte uguali; prefissi titoli [BE], [FE - Web], [FE - Mobile], [UX - Web], [UX - Mobile], [UX - Web/Mobile], [FW]; glossario; lingua; vincoli già decisi.
- Scomposizione di ogni requisito: epica dell'area nella release giusta; se c'è interfaccia e il design non è pronto, una UX Story per ogni componente con UI; a design pronto una Story BE (dati, API, regole), una FE Web e una FE Mobile secondo i componenti; due storie BE se il back-end ha due lavori distinti; un ticket FW collegato come bloccante se servono firmware o librerie nuove; ogni ticket collegato al requisito e ai fratelli (relates, oppure blocks se uno attende l'altro).
- Tipi: Story = valore per l'utente con esito verificabile; UX Story = progettare l'interfaccia (flussi, schermate, stati) prima dello sviluppo; Bug = comportamento diverso dall'atteso in una funzione consegnata; Task = lavoro tecnico circoscritto senza valore diretto.
- Metadati obbligatori su ogni ticket: epica, label di release, label di tipo lavoro, campi custom obbligatori di Jira, prefisso nel titolo. Componente e assegnatario sono facoltativi: nella strutturazione del backlog non servono, si impostano più avanti quando esistono in Jira.
- I ticket si scrivono sempre in inglese con i modelli standard; "Points to clarify" rende visibili le decisioni che spettano a PO o cliente.
- Ciclo per ogni richiesta: capire l'input; guardare lo stato reale prima di scrivere; chiedere quando sbagliare costa caro, altrimenti procedere dichiarando l'ipotesi; scrivere applicando il kit; creare, poi collegare con le chiavi reali, poi verificare; rispondere in breve (cosa è stato fatto, scelte fatte al posto del PO, cosa resta da decidere, ticket corrispondenti su altri componenti).
- Ogni decisione che cambia prodotto, processo o classificazione va nel registro (data, decisione al presente, chi, fonte, impatto, regola del kit). Una decisione che ne contraddice un'altra aggiunge una riga e indica quale sostituisce.
- Sicurezza: cita solo chiavi di ticket esistenti; usa i nomi esatti dei tipi di collegamento; non correggere dati del PO senza chiedere; di' cosa lo strumento non può fare (non crea progetti, componenti, versioni o sprint); fermati prima di azioni irreversibili o costose; segnala subito problemi di sicurezza.
- Verso il cliente: registro formale, frasi brevi, prima la cosa più importante, mai promettere date non confermate.`;

/* scritture: una alla volta, nell'ordine in cui avvengono */
let wchain=Promise.resolve();
function queue(fn){wchain=wchain.then(fn).catch(dbErr);return wchain}
function dbErr(e){const c=e?.code;
  if(c==="invalid_argument"){READONLY=true;toast("Non hai i permessi per modificare questo progetto: lo strumento resta in sola lettura.")}
  else if(c==="quota_exceeded")toast("Spazio dati esaurito: elimina documenti o ticket non più necessari.");
  else if(c==="resource_exhausted")toast("Troppe modifiche in poco tempo: attendi qualche secondo.");
  else if(c==="revoked")toast("L'accesso ai dati condivisi è stato revocato.");
  else toast("Salvataggio non riuscito"+(c?" ("+c+")":"")+". Riprova.");
  scheduleRender()}
function saveMeta(id,data){S[id]=data;id==="chat"?renderChat():scheduleRender();if(DB)queue(()=>DB.doc("meta/"+id).set(data))}
let QSYNC=false;
function put(c,id,data){S[c]={...S[c],[id]:data};scheduleRender();const r=DB?queue(()=>DB.collection(c).doc(id).set(data)):undefined;if(c==="questions"&&!QSYNC)queueMicrotask(syncQDecisions);return r}
// Ogni risposta o ipotesi entra da sola nel registro delle decisioni; se la risposta cambia, si aggiorna la stessa riga
function syncQDecisions(){if(QSYNC||READONLY)return;QSYNC=true;try{let n=0;
  arr("questions").forEach(q=>{const a=q.answer?.trim(),h=q.hypothesis?.trim();if(!(a||h))return;const text=a?`${q.q} → ${a}`:`(Ipotesi) ${q.q} → ${h}`,who=q.who||(a?"Cliente":"PO (ipotesi)"),d=q.decisionId&&S.decisions[q.decisionId];
   if(d){if(d.autoText!==text||d.source==="Domande di apertura (Fase 0)"){put("decisions",q.decisionId,{...d,text,who,autoText:text,source:d.source==="Domande di apertura (Fase 0)"?"Domande di apertura":d.source})}return}
   const id=uid();put("decisions",id,{date:today(),text,autoText:text,who,type:"Perimetro funzionale",source:"Domande di apertura",impact:"",kit:"",replaces:"",at:Date.now()+n++});put("questions",q.id,{...S.questions[q.id],decisionId:id})})}finally{QSYNC=false}}
function del(c,id){const o={...S[c]};delete o[id];S[c]=o;scheduleRender();if(DB)queue(()=>DB.collection(c).doc(id).delete())}
const P=()=>S.project||{}, K=()=>S.kit||defaultKit();

const reqList=()=>arr("reqs").sort((a,b)=>(a.order??0)-(b.order??0)||String(a.code).localeCompare(b.code));
const cleanVerify=v=>{if(!v||v==="ok"||!/^Manca: /.test(v))return v;const rest=v.slice(7).split(/,\s*(?![^()]*\))/).filter(x=>x.trim()&&!/^(componente|fixversion|assegnatario)/i.test(x.trim()));return rest.length?"Manca: "+rest.join(", "):"ok"},vOf=t=>cleanVerify(t.verify);
const ticketList=()=>arr("tickets").sort((a,b)=>String(a.ref).localeCompare(b.ref,undefined,{numeric:true}));
const editKit=fn=>{const k=clone(K());fn(k);syncPhases(k);saveMeta("kit",k)};
/* Release = Fase: una Fase per ogni release del K2, con lo stesso nome; l'epica sta sotto la Fase della sua release.
   Le Fasi già create in Jira restano anche se la loro release sparisce (in Jira non si cancella nulla da qui). */
function syncPhases(k){const h=k.hier;if(!h)return;const ph=h.phases||[];
  const list=k.releases.map(r=>r.name).filter(Boolean).map(n=>ph.find(f=>f.name===n)||{id:uid(),name:n,key:""});
  ph.forEach(f=>{if(f.key&&!list.includes(f))list.push(f)});h.phases=list;
  k.epics.forEach(e=>{const f=list.find(x=>x.name===e.release);e.phase=f?f.id:""})}
const editProject=fn=>{const p=clone(P());fn(p);saveMeta("project",p)};

  if(!t.epic)e.push("Epica mancante (K3)");else if(!k.epics.some(x=>x.name===t.epic))e.push("Epica non presente nel kit");
  const r=relOf(t.release);if(!t.release)e.push("Release mancante (K2)");else if(!r)e.push("Release non presente nel kit");else{if(!r.label)e.push("Label di release mancante")}
  if(!WORK.includes(t.work))e.push("Label di tipo lavoro mancante (K5)");
  const extra=K().extraLabels.split(",").map(s=>s.trim()).filter(Boolean);

const FIND_TYPES={too_big:"Troppo grande",vague_acceptance:"Criteri vaghi",missing_dependency:"Dipendenza mancante",duplicate:"Possibile duplicato",unclear_scope:"Ambito poco chiaro",missing_clarification:"Da chiarire",other:"Altro"};

   <div class="toolbar">${AIB("qualityCheck",f.length?"Analizza di nuovo":"Analizza il backlog",{cls:"primary",dis:!ticketList().length})}${f.length?B("clearQuality","Svuota",{cls:"danger"}):""}</div>

   ${open.length?`<div class="row" style="gap:6px;margin:0 0 10px">${[["high","alta","err"],["medium","media","warn"],["low","bassa",""]].map(([s0,l,c])=>{const n=open.filter(x=>x.severity===s0).length;return n?`<span class="pill ${c}">${n} ${l}</span>`:""}).join("")}</div>`:""}

A.qualityCheck=()=>run("qualityCheck","Claude sta leggendo…",async()=>{const ts=ticketList();if(!ts.length)return;const refs=new Set(ts.map(t=>t.ref)),all=ts.map(t=>`${t.ref} ${fullTitle(t)} (${t.type}, epica ${t.epic||"-"})`).join("\n");const findings=[];
  for(let i=0;i<ts.length;i+=10){const chunk=ts.slice(i,i+10);busy.qualityCheck=`Analizzo ${Math.min(i+10,ts.length)} di ${ts.length}…`;scheduleRender();
    const prompt=`${RULES}\n\nCOMPITO: controlla la qualità di questi ticket e segnala SOLO problemi reali, concreti e utili (massimo 10 per questo gruppo). Criteri:\n- too_big: mescola più lavori o richiede più di una settimana; proponi come dividerlo.\n- vague_acceptance: criteri di accettazione assenti o non verificabili ("funziona bene", "veloce"); proponi criteri verificabili.\n- missing_dependency: dipende da un altro ticket, da firmware/librerie o dal design e manca il collegamento (blocks/relates); indica da quale ticket.\n- duplicate: si sovrappone a un altro ticket della lista; indica quale.\n- unclear_scope: ambito o ruolo utente poco chiari.\n- missing_clarification: c'è una decisione aperta che non compare in «Points to clarify».\nNon inventare problemi: se un ticket è a posto, non citarlo.\n\nELENCO COMPLETO (per trovare duplicati e dipendenze):\n${all}\n\nTICKET DA ANALIZZARE:\n${chunk.map(t=>ticketBrief(t)).join("\n---\n")}\n\nRispondi SOLO con JSON: {"findings":[{"ref":"T-001","type":"too_big|vague_acceptance|missing_dependency|duplicate|unclear_scope|missing_clarification|other","severity":"high|medium|low","message":"una frase in italiano","suggestion":"cosa fare, in italiano"}]}`;
    let out;try{out=await ask(prompt)}catch(e){throw{ai:1,e}}
    (out?.findings||[]).forEach(x=>{if(refs.has(x.ref)&&x.message)findings.push({id:uid(),ref:x.ref,type:FIND_TYPES[x.type]?x.type:"other",severity:SEV_ORD[x.severity]!=null?x.severity:"medium",message:String(x.message),suggestion:String(x.suggestion||""),status:"open"})})}
  saveMeta("quality",{at:Date.now(),count:ts.length,findings});setMsg("backlog","ok",findings.length?`Analisi completata: ${findings.length} segnalazioni.`:"Analisi completata: nessun problema rilevato.")});

function progStart(act,o){T.prog[act]={start:Date.now(),done:0,total:0,items:[],detail:"",...o};if(!PROG_T)PROG_T=setInterval(()=>{document.querySelectorAll(".prog [data-since]").forEach(e=>e.textContent=elapsed(+e.dataset.since));if(!Object.keys(T.prog).length){clearInterval(PROG_T);PROG_T=null}},1000)}
function progEnd(act){const st=!!T.prog[act]?.stop;delete T.prog[act];return st}
function progPaint(act){const el=document.querySelector(`.prog[data-prog="${act}"]`);if(el)el.outerHTML=progBlock(act)}
function progBlock(act){const p=T.prog[act];if(!p)return"";const det=p.total>1,pct=det?Math.min(100,Math.round(p.done/p.total*100)):0;
  return`<div class="prog" data-prog="${act}" role="status" aria-live="polite"><div class="prog-h">${ICO("i-sparkle")}<span class="prog-t">${esc(p.label)}</span><span class="prog-e" data-since="${p.start}">${elapsed(p.start)}</span></div>
  <div class="track${det?"":" ind"}" ${det?`role="progressbar" aria-label="Avanzamento" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.done}"`:""}><i style="${det?`width:${Math.max(pct,3)}%`:""}"></i></div>
  <div class="prog-f"><span class="small muted">${esc(p.detail||"")}</span>${p.stop?`<span class="small muted">Mi fermo dopo ${p.unit==="documento"?"questo documento":"questo gruppo"}…</span>`:`<button type="button" class="link" data-act="stopProg" data-prog="${act}">Ferma</button>`}</div>
  ${p.items.length?`<ul class="prog-items">${p.items.slice(-4).map(x=>`<li>${x.code?`<span class="key">${esc(x.code)}</span>`:""}<span class="tt">${esc(x.title)}</span></li>`).join("")}<li class="sk" aria-hidden="true"><i></i><i></i></li></ul>`:""}</div>`}
const RX_FOUND=/(?:"sourceId"\s*:\s*"((?:[^"\\]|\\.)*)"\s*,\s*)?"title"\s*:\s*"((?:[^"\\]|\\.)*)"/g;
function progFound(act,text,ix,n,added){const p=T.prog[act];if(!p)return;const it=[];for(const m of text.matchAll(RX_FOUND)){let t=m[2];try{t=JSON.parse('"'+t+'"')}catch{}it.push({code:m[1]||"",title:t})}
  if(it.length===p.items.length)return;p.items=it;p.detail=`${n>1?`Documento ${ix+1} di ${n} · `:""}${it.length===1?"1 requisito trovato":it.length+" requisiti trovati"}${added?` · ${added} già aggiunti`:""}`;progPaint(act)}
async function run(act,label,fn,step){busy[act]=label;scheduleRender();try{await fn()}catch(e){console.warn(e);setMsg(step||STEPS[cur].id,"err",jiraOrAi(e))}finally{delete busy[act];scheduleRender()}}

const CDN="https://cdnjs.cloudflare.com/ajax/libs/";

async function extract(file){const n=file.name.toLowerCase(),buf=()=>file.arrayBuffer();
  if(/\.docx$/.test(n)){await loadScript(CDN+"mammoth/1.6.0/mammoth.browser.min.js");const r=await window.mammoth.extractRawText({arrayBuffer:await buf()});return["Word",r.value]}
  if(/\.(xlsx|xls)$/.test(n)){await loadScript(CDN+"xlsx/0.18.5/xlsx.full.min.js");const wb=window.XLSX.read(await buf(),{type:"array"});return["Excel",wb.SheetNames.map(s=>`## Foglio: ${s}\n`+window.XLSX.utils.sheet_to_csv(wb.Sheets[s],{blankrows:false})).join("\n\n")]}
  if(/\.pdf$/.test(n)){await loadScript(CDN+"pdf.js/3.11.174/pdf.min.js");await loadScript(CDN+"pdf.js/3.11.174/pdf.worker.min.js");const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
    const doc=await lib.getDocument({data:new Uint8Array(await buf()),isEvalSupported:false}).promise;let out="";for(let i=1;i<=doc.numPages&&out.length<MAXCH;i++){const c=await(await doc.getPage(i)).getTextContent();out+=`\n--- Pagina ${i} ---\n`+c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("")}return["PDF",out]}
  if(file.type.startsWith("image/")){if(!SAMPLE||!LIM?.images)throw{message:"Per le immagini serve Claude con l'invio di immagini attivo."};
    const r=await SAMPLE("Trascrivi fedelmente tutto il testo visibile in questa immagine (documento, screenshot, frame di design o foglio). Poi descrivi in modo strutturato elementi di interfaccia, tabelle e annotazioni utili a scrivere requisiti software. Rispondi in italiano.",{images:[file],modelTier:"default",cache:false});return["Immagine",r.text]}
  return[/\.csv$/.test(n)?"CSV":/\.(md|markdown)$/.test(n)?"Markdown":"Testo",await file.text()]}

${TEMPLATES.Task}

const PROTO_A="<<<TRAMA",PROTO_B="TRAMA>>>";

  const b=s.indexOf(PROTO_B,a);let meta=null;

  return{text:(s.slice(0,a)+(b<0?"":s.slice(b+PROTO_B.length))).trim(),meta}}
function cleanMeta(m){if(!m||typeof m!=="object")return null;
  const actions=(Array.isArray(m.actions)?m.actions:[]).slice(0,5).map(a=>{if(!a||typeof a!=="object")return null;
    if(a.type==="add_decision"&&a.decision)return{type:a.type,decision:String(a.decision).slice(0,500),who:String(a.who||"").slice(0,80),dtype:DECISION_TYPES.includes(a.category)?a.category:"Altro",impact:String(a.impact||"").slice(0,300),replaces:String(a.replaces||"").slice(0,300),status:"open"};
    if(a.type==="add_requirement"&&a.fields&&typeof a.fields==="object"&&String(a.fields.title||"").trim())return{type:a.type,fields:pick(a.fields,REQ_FIELDS),status:"open"};
    if(a.type==="update_requirement"&&a.code&&a.fields&&typeof a.fields==="object")return{type:a.type,code:String(a.code),fields:pick(a.fields,REQ_FIELDS),status:"open"};
    if(a.type==="update_ticket"&&a.ref&&a.fields&&typeof a.fields==="object")return{type:a.type,ref:String(a.ref),fields:pick(a.fields,TICKET_FIELDS),status:"open"};

  const next=(Array.isArray(m.next)?m.next:[]).map(x=>String(x).trim().slice(0,140)).filter(Boolean).slice(0,3);
  return actions.length||next.length?{actions,next}:null}

  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);document.body.classList.remove("chat-drag");ls.set(GEOM_KEY,readGeom())};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up)}
$(".chat-h").addEventListener("pointerdown",e=>{if(isMobile()||e.button>0||e.target.closest("button"))return;dragWith(e,e.currentTarget,(s0,dx,dy)=>applyGeom({...s0,x:s0.x+dx,y:s0.y+dy}))});
chatEl.addEventListener("pointerdown",e=>{const hd=e.target.closest(".rz");if(!hd||isMobile()||e.button>0)return;const dir=hd.dataset.r;
  dragWith(e,hd,(s0,dx,dy)=>{let{x,y,w,h}=s0;if(dir.includes("e"))w=s0.w+dx;if(dir.includes("s"))h=s0.h+dy;if(dir.includes("w")){w=s0.w-dx;x=s0.x+dx}if(dir.includes("n")){h=s0.h-dy;y=s0.y+dy}
    if(w<MINW){if(dir.includes("w"))x-=MINW-w;w=MINW}if(h<MINH){if(dir.includes("n"))y-=MINH-h;h=MINH}applyGeom({x,y,w,h})})});
const resetGeom=()=>{ls.set(GEOM_KEY,null);applyGeom(null)};
$("#chatReset").onclick=resetGeom;$(".chat-h").addEventListener("dblclick",e=>{if(!e.target.closest("button"))resetGeom()});
addEventListener("resize",()=>applyGeom(ls.get(GEOM_KEY,null)));applyGeom(ls.get(GEOM_KEY,null));
if(ls.get("chatOpen",false)&&matchMedia("(min-width:761px)").matches)setChatOpen(true,false);
if(!ls.get("chatHinted",false)){ls.set("chatHinted",true);fabEl.classList.add("hint");setTimeout(()=>fabEl.classList.remove("hint"),5000)}

/* ================= accesso e progetti ================= */
function showGate(kind,note){GATE=kind;document.body.classList.add("gate");document.body.classList.remove("has-recap");$("#projName").textContent="";$("#pmenu").hidden=true;
  $("#capChips").innerHTML="";
  if(kind==="login"){$("#main").innerHTML=`<div style="padding:8vh 0 0;max-width:560px"><div class="eyebrow">Trama</div><h1>Accedi con il tuo account Atlassian</h1>
    <p class="lead">Lo strumento lavora sul tuo Jira con i tuoi permessi: i ticket risultano creati da te e vedi solo i progetti dei siti a cui hai accesso.</p>
    ${note?`<div class="msg warn">${esc(note)}</div>`:""}<div class="toolbar"><a class="btn primary" href="/api/auth/login" style="text-decoration:none;background:var(--primary);color:var(--on-primary);border-color:var(--primary)">Accedi con Atlassian</a><a href="/">Scopri come funziona</a></div><p class="small muted" style="margin-top:18px">Accedendo accetti il trattamento dei dati descritto nell'<a href="/privacy">informativa privacy</a>.</p></div>`;return}
  renderPicker(note)}
function renderPicker(note){const ps=PROJECTS||[];const siteName=id=>(SITES.find(s=>s.id===id)||{}).name||"";
  const day=d=>{const x=new Date(d),t=new Date();const diff=Math.round((new Date(t.toDateString())-new Date(x.toDateString()))/864e5);return diff===0?"oggi":diff===1?"ieri":"il "+x.toLocaleDateString("it-IT")};
  const showForm=T.npOpen||(PROJECTS&&!ps.length);
  const form=`<div class="card np-card"><h2>${ps.length?"Nuovo progetto":"Crea il tuo primo progetto"}</h2><div class="grid">${F("Nome del progetto",`<input id="npName" placeholder="Lumio · Release 1">`)}${F("Sito Atlassian",`<select id="npSite">${SITES.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.url.replace(/^https:\/\//,""))}</option>`).join("")}</select>`)}</div>
   <div class="toolbar" style="margin-top:12px"><button class="primary" data-act="createProject" ${busy.createProject?"disabled":""}>${busy.createProject?"Creazione…":"Crea progetto"}</button>${ps.length?`<button type="button" data-act="npToggle">Annulla</button>`:""}</div></div>`;
  const card=p=>{const mine=ME&&p.created_by===ME.accountId,armed=T.arm["dp"+p.id];
   return`<div class="proj-card"><a class="pc-link" href="/studio?p=${encodeURIComponent(p.id)}" aria-label="Apri ${esc(p.name)}"></a>
    <div class="pc-top"><h2>${esc(p.name)}</h2>${mine?`<div class="dd pc-dd"><button type="button" class="dd-btn icon-btn" aria-haspopup="menu" aria-expanded="${!!armed}" aria-label="Altre azioni per ${esc(p.name)}"><span aria-hidden="true">⋯</span></button><div class="dd-menu right" role="menu" ${armed?"":"hidden"}><button type="button" role="menuitem" class="danger-item" data-act="deleteProject" data-id="${esc(p.id)}">${armed?"Conferma: elimina il progetto":"Elimina progetto"}</button></div></div>`:""}</div>
    <div class="pc-meta">${p.jira_key?`<span class="key">${esc(p.jira_key)}</span>`:""}<span>${esc(siteName(p.cloud_id)||(p.site_url||"").replace(/^https:\/\//,""))}</span></div>
    <div class="pc-stats">${p.reqs} requisiti · ${p.tickets} ticket</div>
    <div class="small muted">aggiornato ${day(p.updated_at)}${p.created_by_name?` · creato da ${esc(p.created_by_name)}`:""}</div></div>`};
  $("#main").innerHTML=`<div class="pk-h"><div><div class="eyebrow">Trama</div><h1>I tuoi progetti</h1></div>${ps.length&&!showForm?`<button type="button" class="primary" data-act="npToggle">+ Nuovo progetto</button>`:""}</div>
   <p class="lead">I progetti dei siti Atlassian a cui hai accesso. Chi lavora sullo stesso sito vede gli stessi requisiti, kit e backlog.</p>
   ${note?`<div class="msg warn">${esc(note)}</div>`:""}
   ${showForm?form:""}
   ${ps.length?`<div class="projgrid">${ps.map(card).join("")}${showForm?"":`<button type="button" class="proj-new" data-act="npToggle">+ Nuovo progetto</button>`}</div>`:PROJECTS?"":'<p class="empty">Carico i progetti…</p>'}
   <details class="item pk-data" data-k="pk-data"><summary><span class="ttl">I tuoi dati in Trama</span></summary><div class="in"><p class="small" style="margin:10px 0">Trama conserva il tuo ID Atlassian, nome, email e i token di accesso cifrati. Leggi l'<a href="/privacy" target="_blank" rel="noopener">informativa privacy</a>. Puoi cancellarli quando vuoi: i progetti restano, senza il tuo nome come autore.</p>
   <button class="${T.arm.forgetMe?"armed":"danger"}" data-act="forgetMe">${T.arm.forgetMe?"Conferma: elimina i miei dati ed esci":"Elimina i miei dati da Trama"}</button></div></details>`;
  $$("#main details[data-k]").forEach(d=>{if(openSet.has(d.dataset.k))d.open=true})}
A.npToggle=()=>{T.npOpen=!T.npOpen;renderPicker();if(T.npOpen)$("#npName")?.focus()};
async function loadProjects(){try{PROJECTS=(await BS.api("/api/projects")).projects}catch(e){PROJECTS=[];toast(e.message||"Progetti non caricati.")}if(GATE==="picker")renderPicker()}
A.createProject=async()=>{const name=$("#npName").value.trim(),cloudId=$("#npSite").value;if(!name){toast("Dai un nome al progetto.");return}
  busy.createProject=1;renderPicker();try{const r=await BS.api("/api/projects",{method:"POST",body:{name,cloudId}});location.href="/studio?p="+encodeURIComponent(r.project.id)}catch(e){toast(e.message||"Progetto non creato.")}finally{delete busy.createProject;if(GATE==="picker")renderPicker()}};
A.forgetMe=el=>{arm("forgetMe",el,async()=>{try{await BS.api("/api/me",{method:"DELETE"});location.href="/?dati=eliminati"}catch(e){toast(e.message||"Cancellazione non riuscita.")}});if(GATE==="picker")renderPicker()};
A.deleteProject=el=>{const id=el.dataset.id,k="dp"+id;if(T.arm[k]){delete T.arm[k];closeMenus();(async()=>{try{await BS.api("/api/projects/"+encodeURIComponent(id),{method:"DELETE"});toast("Progetto eliminato.");loadProjects()}catch(e){toast(e.message)}})()}else{T.arm[k]=1;renderPicker();setTimeout(()=>{if(T.arm[k]){delete T.arm[k];if(GATE==="picker")renderPicker()}},4000)}};
const _scheduleRender=scheduleRender;scheduleRender=function(){if(GATE==="picker"){renderPicker();return}if(GATE)return;_scheduleRender()};
/* menu a tendina della barra: progetto e account */
function closeMenus(except){document.querySelectorAll(".dd").forEach(d=>{if(d===except)return;const b=d.querySelector(".dd-btn"),m=d.querySelector(".dd-menu");if(m&&!m.hidden){m.hidden=true;b.setAttribute("aria-expanded","false")}})}
document.addEventListener("click",e=>{const b=e.target.closest(".dd-btn");if(b){const d=b.closest(".dd"),m=d.querySelector(".dd-menu"),open=m.hidden;closeMenus(d);m.hidden=!open;b.setAttribute("aria-expanded",String(open));if(open){if(d.id==="pmenu"&&PROJECTS===null&&ME){PROJECTS=[];BS.api("/api/projects").then(r=>{PROJECTS=r.projects||[];renderChrome()}).catch(()=>{})}m.querySelector("a,button")?.focus()}return}if(!e.target.closest(".dd-menu"))closeMenus()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const open=document.querySelector(".dd-menu:not([hidden])");if(open){closeMenus();open.closest(".dd").querySelector(".dd-btn").focus()}});
$("#logoutBtn").onclick=async()=>{try{await BS.api("/api/auth/logout",{method:"POST"})}catch(e){}location.href="/"};
BS.onUnauthenticated=code=>{if(GATE!=="login")showGate("login",code==="needs_reauth"?"La sessione Atlassian è scaduta: accedi di nuovo per continuare. Il lavoro salvato non va perso.":"La sessione è scaduta: accedi di nuovo.")};
let syncFail=0;BS.onSync=ok=>{const was=syncFail;syncFail=ok?0:syncFail+1;if(!!was!==!!syncFail){caps.db=syncFail?"warn":"ok";renderChrome()}};

async function checkBridge(){const h=await BS.checkBridge();const st=!h?"off":h.loggedIn===false?"login":"ok";if(st===caps.sample)return;caps.sample=st;SAMPLE=st==="ok"?BS.sample:null;render();renderChat()}

/* ================= avvio ================= */
$("#main").innerHTML='<p class="empty" style="padding-top:10vh">Caricamento…</p>';
(async()=>{
  try{const me=await BS.api("/api/me");ME=me.user;SITES=me.sites||[]}catch(e){if(e.code!=="unauthenticated"&&e.code!=="needs_reauth")showGate("login","Il server non risponde. Riprova tra poco.");else showGate("login");return}
  $("#who").hidden=false;$("#whoName").textContent=ME.name||ME.email||"";$("#whoMail").textContent=ME.name&&ME.email?ME.email:"";if(ME.picture)$("#whoPic").src=ME.picture;else{$("#whoPic").hidden=true;const ini=$("#whoIni");ini.hidden=false;ini.textContent=String(ME.name||ME.email||"?").split(/[\s@.]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")}
  if(!PID){showGate("picker");loadProjects();return}
  let st;try{st=await BS.api("/api/projects/"+encodeURIComponent(PID))}catch(e){showGate("picker",e.code==="not_found"?"Questo progetto non esiste più o non è accessibile con il tuo account.":"Progetto non caricato: "+(e.message||""));loadProjects();return}
  SERVER_PROJECT=st.project;document.title=st.project.name+" · Trama";
  DB=BS.createDB(PID,st);caps.db="ok";MCP=BS.mcp;caps.mcp="ok";LIM=await BS.sample.limits();DL=BS.downloads;
  await checkBridge();setInterval(()=>{if(!document.hidden)checkBridge()},10000);
  const LOADED=new Set();
  DB.collection("meta").onSnapshot(s=>{if(!LOADED.has("meta")){LOADED.add("meta");DATA_READY=["meta",...COLS].every(x=>LOADED.has(x));queueMicrotask(()=>migrateSpike(LOADED))}s.docs.forEach(d=>{if(d.exists)S[d.id]=d.data()});S.kit={...defaultKit(),...(S.kit||{}),team:{...defaultKit().team,...(S.kit?.team||{})}};renderChat();scheduleRender()});
  // alla prima lettura di domande e registro si riallineano le decisioni nate dalle domande (anche quelle scritte da versioni precedenti)
  COLS.forEach(c=>DB.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[c]=o;if(!LOADED.has(c)){LOADED.add(c);DATA_READY=["meta",...COLS].every(x=>LOADED.has(x));if(c==="tickets")queueMicrotask(()=>migrateSpike(LOADED));if(LOADED.has("questions")&&LOADED.has("decisions")&&!LOADED.has("qsync")){LOADED.add("qsync");queueMicrotask(syncQDecisions)}}scheduleRender()}));
  setTimeout(()=>{const p=P();if(p.cloudId!==SERVER_PROJECT.cloudId||p.siteUrl!==SERVER_PROJECT.siteUrl)editProject(q=>{q.cloudId=SERVER_PROJECT.cloudId;q.siteUrl=SERVER_PROJECT.siteUrl;if(!q.name)q.name=SERVER_PROJECT.name})},60);
  render();renderChat();if(STEPS[cur].id==="create")A.go({dataset:{i:cur}})})();
</script>
