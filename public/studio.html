<body>

<div class="desk-only" role="alert"><div class="card"><div class="eyebrow">Trama</div><h1>Trama è pensato per il computer</h1><p class="lead" style="margin:0 0 16px">Trama lavora con tabelle, pannelli e documenti lunghi: aprilo da un computer, con una finestra larga almeno 900 pixel.</p><a href="/">Torna alla home</a></div></div>
<div class="app">
  <header class="top">
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#23307A"/><rect x="6" y="7.5" width="20" height="4.5" rx="2.25" fill="#fff"/><rect x="6" y="20" width="20" height="4.5" rx="2.25" fill="#fff"/><rect x="13.75" y="4.5" width="4.5" height="23" rx="2.25" fill="#F2A541"/><rect x="6" y="13.75" width="20" height="4.5" rx="2.25" fill="#fff" stroke="#23307A" stroke-width="1.6"/></svg><span class="wm" aria-hidden="true"><svg class="wm-t" viewBox="0 0 21 47" aria-hidden="true" focusable="false"><use href="/icons.svg#tx-t" width="21" height="47"/></svg>rama</span><span class="sr-only">Trama, home</span></a>
    <div class="dd pmenu" id="pmenu" hidden>
      <button type="button" class="dd-btn proj" id="projBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="projMenu"><span class="proj-n" id="projName"></span><span class="proj-k" id="projKey"></span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="dd-menu" id="projMenu" role="menu" hidden></div>
    </div>
    <div class="chips" id="capChips"></div>
    <button type="button" class="icon-btn" id="rulesBtn" data-act="openRules" aria-label="Regole del playbook" title="Regole del playbook" hidden><svg class="ic"><use href="/icons.svg#i-shield"/></svg></button>
    <div class="dd who" id="who" hidden>
      <button type="button" class="dd-btn av-btn" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu"><img id="whoPic" alt=""><span class="av" id="whoIni" hidden></span><span class="sr-only">Il tuo account</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="dd-menu right" id="userMenu" role="menu" hidden>
        <div class="dd-head"><b id="whoName"></b><span id="whoMail"></span></div>
        <a role="menuitem" href="/studio">Tutti i progetti</a>
        <button type="button" role="menuitem" id="healthItem" data-act="healthCheck" hidden>Verifica prima della demo</button>
        <a role="menuitem" href="/installazione">Guida al ponte Claude</a>
        <a role="menuitem" href="/architettura">Architettura</a>
        <a role="menuitem" href="/privacy">Privacy e dati</a>
        <div class="dd-sep"></div>
        <button type="button" role="menuitem" id="logoutBtn">Esci</button>
      </div>
    </div>
  </header>
  <div class="body">
    <aside id="stepper" aria-label="Passi del processo"></aside>
    <main id="main"></main>
    <aside id="recap" aria-label="Riepilogo del backlog"></aside>
    <aside id="chat" aria-label="Chat con Claude"><i class="rz" data-r="n"></i><i class="rz" data-r="s"></i><i class="rz" data-r="w"></i><i class="rz" data-r="e"></i><i class="rz" data-r="nw"></i><i class="rz" data-r="ne"></i><i class="rz" data-r="sw"></i><i class="rz" data-r="se"></i>
      <div class="chat-top"><div class="chat-h"><h2><span class="chat-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="bubble" d="M10 4.5h12a6.5 6.5 0 0 1 6.5 6.5v6.5a6.5 6.5 0 0 1-6.5 6.5h-6.4l-5.6 4.2V24A6.5 6.5 0 0 1 3.5 17.5V11A6.5 6.5 0 0 1 10 4.5z"/><rect class="wf wf1" x="8" y="8.9" width="16" height="2.6" rx="1.3"/><rect class="wf wf3" x="8" y="17.1" width="16" height="2.6" rx="1.3"/><rect class="wp" x="14.7" y="7.1" width="2.6" height="14.4" rx="1.3"/><rect class="wf wf2" x="8" y="13" width="16" height="2.6" rx="1.3"/></svg></span>Chat con Claude</h2><span class="chip plain" id="chatCtx"></span><button id="chatMemBtn" class="link" type="button" aria-expanded="false" aria-controls="chatMem">Memoria</button><button id="chatReset" class="link" type="button" hidden title="Riporta la finestra in basso a destra">Reimposta</button><button id="chatClose" class="link" type="button" aria-label="Riduci la chat a icona" title="Riduci a icona: la conversazione resta"><span class="d">Riduci</span><span class="m">Chiudi</span></button></div><div id="chatMem" hidden></div></div>
      <div id="chatLog" aria-live="polite"></div>
      <div class="sugg" id="chatSugg"></div>
      <form id="chatForm">
        <textarea id="chatIn" placeholder="Chiedi a Claude: un dubbio sul requisito, una decisione da registrare, un ticket da correggere…" aria-label="Messaggio per Claude"></textarea>
        <div class="row">
          <label class="btn" id="chatImgLbl" hidden>Allega immagine<input type="file" id="chatImg" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>
          <span class="small muted" id="chatImgName"></span>
          <span style="flex:1"></span>
          <button type="button" id="chatStop" hidden>Ferma</button>
          <button type="submit" class="primary" id="chatSend">Invia</button>
        </div>
      </form>
    </aside>
  </div>
</div>
<button id="chatFab" type="button" aria-label="Chiedi a Claude: apri la chat" aria-expanded="false" aria-controls="chat" title="Chat con Claude"><span class="fab-lb">Chiedi a Claude</span><span class="fab-ic"><svg class="fab-bub" viewBox="0 0 32 32" aria-hidden="true"><path class="bubble" d="M10 4.5h12a6.5 6.5 0 0 1 6.5 6.5v6.5a6.5 6.5 0 0 1-6.5 6.5h-6.4l-5.6 4.2V24A6.5 6.5 0 0 1 3.5 17.5V11A6.5 6.5 0 0 1 10 4.5z"/><rect class="wf wf1" x="8" y="8.9" width="16" height="2.6" rx="1.3"/><rect class="wf wf3" x="8" y="17.1" width="16" height="2.6" rx="1.3"/><rect class="wp" x="14.7" y="7.1" width="2.6" height="14.4" rx="1.3"/><rect class="wf wf2" x="8" y="13" width="16" height="2.6" rx="1.3"/></svg><svg class="fab-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
<div id="toast" hidden role="status"></div>
